name: Déployer TuttoUno! sur GitHub Pages

# ===========================================================================
# Ce workflow construit l'application (transformation du JSX en JavaScript
# lisible par le navigateur) puis publie le résultat sur GitHub Pages.
#
# POURQUOI IL EST NÉCESSAIRE
# --------------------------
# GitHub Pages ne sait servir que des fichiers statiques. Or un projet React
# doit être « buildé » avant d'être utilisable. Ce workflow s'en charge sur
# les serveurs de GitHub, gratuitement, sans rien installer sur ton iPhone.
#
# C'est aussi ce qui te permet de modifier un fichier depuis GitHub sur iPhone
# et de voir la nouvelle version en ligne une minute plus tard : chaque
# modification sur `main` déclenche un nouveau déploiement.
#
# ACTIVATION — UNE SEULE FOIS
# ---------------------------
# Settings → Pages → Source → « GitHub Actions ».
#
# LE NOM DU DÉPÔT
# ---------------
# Ce dépôt s'appelle « TuttoUno ». La variable VITE_BASE ci-dessous vaut donc
# "/TuttoUno/". Si tu renommes le dépôt, remplace les DEUX occurrences : ici,
# et la valeur par défaut de vite.config.js.
# ===========================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application
        env:
          VITE_BASE: /TuttoUno/
        run: npm run build

      - name: Ajouter le fichier .nojekyll
        run: touch dist/.nojekyll

      - name: Préparer Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site construit
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
